# Tomato seed-sprouting controller. No watering until delivery is commissioned.
input_boolean:
  tomato_sprouting_enabled:
    name: Tomato sprouting enabled
    icon: mdi:sprout

automation:
  - id: tomato_sprouting_climate
    alias: Tomato sprouting climate and airflow
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: /15
      - trigger: state
        entity_id: input_boolean.tomato_sprouting_enabled
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    actions:
      - variables:
          enabled: "{{ is_state('input_boolean.tomato_sprouting_enabled', 'on') }}"
          rh: "{{ states('sensor.pot_scale_weight_c3_humidity') | float(-1) }}"
          temp: "{{ states('sensor.pot_scale_weight_c3_temperature') | float(-100) }}"
          temp_f: >-
            {{ temp * 1.8 + 32 if state_attr('sensor.pot_scale_weight_c3_temperature', 'unit_of_measurement') == '°C' else temp }}
          fresh: >-
            {{ is_number(states('sensor.pot_scale_weight_c3_humidity'))
               and is_number(states('sensor.pot_scale_weight_c3_temperature'))
               and 0 < rh < 100 and 40 < temp_f < 120
               and state_attr('sensor.pot_scale_weight_c3_temperature', 'unit_of_measurement') in ['°F', '°C']
               and (as_timestamp(now()) - as_timestamp(states.sensor.pot_scale_weight_c3_humidity.last_reported, 0)) < 120
               and (as_timestamp(now()) - as_timestamp(states.sensor.pot_scale_weight_c3_temperature.last_reported, 0)) < 120 }}
          recovering: >-
            {{ temp_f >= 85 or rh >= 85 or not fresh }}
          vent: >-
            {{ enabled and (recovering or (now().minute % 10 == 0 and now().second < 30)) }}
          mist_age: >-
            {{ as_timestamp(now()) - as_timestamp(states.switch.garage_tomato_humidifier.last_changed, 0)
               if states.switch.garage_tomato_humidifier is defined else 0 }}
          mist: >-
            {{ enabled and fresh and not vent and temp_f < 85
               and is_state('switch.tomato_exhaust', 'off')
               and is_state('switch.garage_tomato_fan', 'on')
               and ((is_state('switch.garage_tomato_humidifier', 'on') and rh < 80 and mist_age < 180)
                    or (is_state('switch.garage_tomato_humidifier', 'off') and rh < 75 and mist_age >= 60)) }}
          circulate: >-
            {{ enabled and (vent or rh < 75 or is_state('switch.garage_tomato_humidifier', 'on')
                            or mist or now().minute % 10 < 2) }}
      # Request moisture shutdown first; recovery airflow must still run if
      # that relay fails. Fan confirmation above means
      # a newly started fan must report on before misting can start next tick.
      - if: "{{ not mist and not is_state('switch.garage_tomato_humidifier', 'off') }}"
        then:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: switch.garage_tomato_humidifier
      - if: "{{ vent != is_state('switch.tomato_exhaust', 'on') }}"
        then:
          - action: "{{ 'switch.turn_on' if vent else 'switch.turn_off' }}"
            continue_on_error: true
            target:
              entity_id: switch.tomato_exhaust
      - if: "{{ circulate != is_state('switch.garage_tomato_fan', 'on') }}"
        then:
          - action: "{{ 'switch.turn_on' if circulate else 'switch.turn_off' }}"
            continue_on_error: true
            target:
              entity_id: switch.garage_tomato_fan
      - if: "{{ mist and not is_state('switch.garage_tomato_humidifier', 'on') }}"
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.garage_tomato_humidifier

  - id: tomato_sprouting_mist_cutoff
    alias: Tomato mist runtime cutoff
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.garage_tomato_humidifier
        to: 'on'
        for: '00:03:00'
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.garage_tomato_humidifier
