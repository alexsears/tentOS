# Manual off/on events are serialized; a two-second grace lets the on event establish its timer.
input_boolean:
  mother_refill_enabled:
    name: Mother automatic humidifier refill
  mother_refill_locked:
    name: Mother refill waiting for humidity recovery
  mother_refill_aborted:
    name: Mother refill stopped early
    initial: false
  mother_refill_active:
    name: Mother humidifier refill running
    initial: false
input_datetime:
  mother_refill_last_started:
    name: Mother last humidifier refill
    has_date: true
    has_time: true
  mother_refill_deadline:
    name: Mother humidifier refill stop time
    has_date: true
    has_time: true
template:
- binary_sensor:
  - name: Mother refill dry candidate
    unique_id: mother_refill_dry_candidate
    delay_on: 00:10:00
    state: "{% set rh = states('sensor.moth_a_mother_humidity') %} {% set temp = states('sensor.moth_a_mother_temperature') %} {% set co2 = states('sensor.moth_a_mother_co2') %} {{ is_number(rh) and is_number(temp) and is_number(co2)\n   and 0 < rh | float < 58 and temp | float < 94 and co2 | float < 1200\n   and (now() - states.sensor.moth_a_mother_humidity.last_updated).total_seconds() < 120\n   and (now() - states.sensor.moth_a_mother_temperature.last_updated).total_seconds() < 120\n   and (now() - states.sensor.moth_a_mother_co2.last_updated).total_seconds() < 120\n   and is_state('switch.mother_fan', 'off')\n   and is_state('switch.mother_intake_fan', 'off')\n   and is_state('automation.mother_humidifier_pulse_control', 'on')\n   and states('switch.mother_humidifier') in ['on', 'off']\n   and states('input_select.mother_humidity_control_state') in ['Humidifying', 'Settling', 'Holding', 'Refilling', 'Refill Rest'] }}"
  - name: Mother refill humidity recovered
    unique_id: mother_refill_humidity_recovered
    delay_on: 00:20:00
    state: "{% set rh = states('sensor.moth_a_mother_humidity') %} {{ is_number(rh) and 62 <= rh | float <= 100\n   and (now() - states.sensor.moth_a_mother_humidity.last_updated).total_seconds() < 120\n   and is_state('switch.office_heater', 'off') }}"
automation:
- id: mother_humidifier_auto_refill
  alias: Mother humidifier - refill after sustained dry air
  description: One 10-minute refill after RH below 58 for 10 minutes (was 20 until 2026-09-07; the alert sensor proved 10 min at the same floor gives no false starts) with both fans off. Six-hour minimum between attempts and recovery latch prevent repeat pumping.
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: binary_sensor.mother_refill_dry_candidate
    to: 'on'
  - trigger: time_pattern
    minutes: /1
  actions:
  - condition: template
    value_template: "{{ is_state('input_boolean.mother_refill_enabled', 'on')\n   and is_state('input_boolean.mother_refill_locked', 'off')\n   and is_state('input_boolean.mother_refill_active', 'off')\n   and is_state('binary_sensor.mother_refill_dry_candidate', 'on')\n   and is_state('switch.office_heater', 'off')\n   and as_timestamp(now()) - as_timestamp(states('input_datetime.mother_refill_last_started'), 0) >= 21600 }}"
  - &id001
    action: input_boolean.turn_off
    target:
      entity_id: input_boolean.mother_refill_aborted
  - &id002
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.mother_refill_locked
  - &id003
    action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.mother_refill_last_started
    data:
      timestamp: '{{ as_timestamp(now()) }}'
  - &id004
    action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.mother_refill_deadline
    data:
      timestamp: '{{ as_timestamp(now()) + 600 }}'
  - &id005
    action: input_boolean.turn_on
    target:
      entity_id: input_boolean.mother_refill_active
  - action: switch.turn_on
    target:
      entity_id: switch.office_heater
- id: mother_humidifier_refill_watchdog
  alias: Mother humidifier refill - independent stop
  mode: queued
  triggers:
  - trigger: time_pattern
    seconds: /10
  - trigger: time
    at: input_datetime.mother_refill_deadline
  - trigger: homeassistant
    event: start
    id: restart
  - trigger: event
    event_type: automation_reloaded
    id: restart
  - trigger: state
    entity_id: input_boolean.mother_refill_enabled
    to: 'off'
    id: disabled
  - trigger: state
    entity_id: switch.office_heater
    to: 'on'
    id: pump_on
  - trigger: state
    entity_id: switch.office_heater
    to: 'off'
    id: pump_off
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id | default('''') == ''pump_off'' }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.mother_refill_active
    - stop: Relay was switched off. Do not apply an old off event to a newer on-state.
  - if:
    - condition: template
      value_template: '{{ trigger.id | default('''') == ''pump_on'' and trigger.from_state is defined and trigger.from_state is not none and trigger.from_state.state == ''off'' and is_state(''switch.office_heater'', ''on'') and not is_state(''input_boolean.mother_refill_active'', ''on'') }}'
    then:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
  - condition: template
    value_template: "{{ trigger.id | default('') in ['restart', 'disabled']\n   \n   or (not is_state('input_boolean.mother_refill_active', 'on') and is_state('switch.office_heater', 'on') and (now() - states.switch.office_heater.last_changed).total_seconds() >= 2)\n   or (is_state('input_boolean.mother_refill_active', 'on') and as_timestamp(now()) >= as_timestamp(states('input_datetime.mother_refill_deadline'), 0))\n   or not is_number(states('sensor.moth_a_mother_humidity'))\n   or states('sensor.moth_a_mother_humidity') | float(100) >= 75\n   or not is_number(states('sensor.moth_a_mother_temperature'))\n   or states('sensor.moth_a_mother_temperature') | float(100) >= 94\n   or not is_number(states('sensor.moth_a_mother_co2'))\n   or states('sensor.moth_a_mother_co2') | float(2000) >= 1200\n   or not is_state('switch.mother_fan', 'off')\n   or not is_state('switch.mother_intake_fan', 'off')\n   or (now() - states.sensor.moth_a_mother_humidity.last_updated).total_seconds() >= 120\n   or\
      \ (now() - states.sensor.moth_a_mother_temperature.last_updated).total_seconds() >= 120\n   or (now() - states.sensor.moth_a_mother_co2.last_updated).total_seconds() >= 120 }}"
  - variables:
      was_active: '{{ is_state(''input_boolean.mother_refill_active'', ''on'') }}'
      early_stop: '{{ as_timestamp(now()) < as_timestamp(states(''input_datetime.mother_refill_deadline''), 0) }}'
  - if:
    - condition: state
      entity_id: switch.office_heater
      state: 'on'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.office_heater
  - if:
    - condition: template
      value_template: '{{ was_active }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.mother_refill_active
    - if:
      - condition: template
        value_template: '{{ early_stop }}'
      then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.mother_refill_aborted
    - action: persistent_notification.create
      data:
        notification_id: mother_humidifier_refill
        title: Mother humidifier refill stopped
        message: '{% if early_stop %}The refill stopped before ten minutes, by a manual stop, disable/reload, or safety check.{% else %}The ten-minute refill timer completed.{% endif %} Automatic refills remain locked until RH recovers to 62% for twenty minutes and six hours pass. A manual switch-on starts a new ten-minute timer; safety checks still apply.'
  max: 10
  max_exceeded: silent
- id: mother_humidifier_refill_rearm
  alias: Mother humidifier refill - rearm after recovery
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.mother_refill_humidity_recovered
    to: 'on'
  - trigger: time_pattern
    minutes: /1
  conditions:
  - condition: state
    entity_id: binary_sensor.mother_refill_humidity_recovered
    state: 'on'
  - condition: state
    entity_id: input_boolean.mother_refill_locked
    state: 'on'
  - condition: state
    entity_id: input_boolean.mother_refill_active
    state: 'off'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.mother_refill_locked
